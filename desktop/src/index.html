<!doctype html>
<html lang="en" class="theme-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WSync</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root" class="app" data-view="projects">
      <aside class="rail">
        <div class="rail-top" data-tauri-drag-region></div>

        <div class="rail-brand">
          <span id="daemon-dot" class="dot dot-idle" title="No project is being served"></span>
          <span class="rail-wordmark">
            <span class="rail-wordmark-w">W</span>Sync
          </span>
        </div>

        <nav class="rail-nav" role="tablist" aria-label="Views">
          <button
            id="nav-projects"
            class="rail-item"
            type="button"
            role="tab"
            data-route="projects"
            aria-controls="view"
            aria-selected="true"
            tabindex="0"
          >
            <svg class="rail-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.75 4.25a1 1 0 0 1 1-1h3.4l1.5 1.5h6.6a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1v-8z" />
            </svg>
            <span class="rail-label">Projects</span>
            <span id="projects-count" class="rail-count" hidden></span>
          </button>

          <button
            id="nav-active"
            class="rail-item"
            type="button"
            role="tab"
            data-route="active"
            aria-controls="view"
            aria-selected="false"
            tabindex="-1"
          >
            <svg class="rail-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.5 8.5h2.8l1.5-4.2 3 8.4 1.6-4.2h4.1" />
            </svg>
            <span class="rail-label">Activity</span>
          </button>

          <button
            id="nav-conflicts"
            class="rail-item"
            type="button"
            role="tab"
            data-route="conflicts"
            aria-controls="view"
            aria-selected="false"
            tabindex="-1"
          >
            <svg class="rail-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2 1.9 13h12.2L8 2z" />
              <path d="M8 6.4v3M8 11.2v.5" stroke-linecap="round" />
            </svg>
            <span class="rail-label">Conflicts</span>
            <span
              id="conflicts-badge"
              class="rail-badge"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              title="Conflict count has not been checked"
              hidden
            >—</span>
          </button>
        </nav>

        <div class="rail-foot">
          <nav class="rail-nav rail-nav-secondary" role="tablist" aria-label="Reference and settings">
            <button
              id="nav-docs"
              class="rail-item"
              type="button"
              role="tab"
              data-route="docs"
              aria-controls="view"
              aria-selected="false"
              tabindex="-1"
            >
              <svg class="rail-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.25 2.25h5.4l2.1 2.1v9.4h-7.5a1 1 0 0 1-1-1V3.25a1 1 0 0 1 1-1z" />
                <path d="M9.65 2.25v2.1h2.1" />
                <path d="M5.8 7.4h4.4M5.8 9.6h4.4M5.8 11.8h2.4" />
              </svg>
              <span class="rail-label">Docs</span>
            </button>

            <button
              id="nav-settings"
              class="rail-item"
              type="button"
              role="tab"
              data-route="settings"
              aria-controls="view"
              aria-selected="false"
              tabindex="-1"
            >
              <svg class="rail-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="8" cy="8" r="2.15" />
                <path d="M8 1.3v1.75M8 12.95v1.75M14.7 8h-1.75M3.05 8H1.3M12.74 3.26l-1.24 1.24M4.5 11.5l-1.24 1.24M12.74 12.74 11.5 11.5M4.5 4.5 3.26 3.26" />
              </svg>
              <span class="rail-label">Settings</span>
            </button>
          </nav>
        </div>
      </aside>

      <header class="topbar" data-tauri-drag-region>
        <div class="topbar-context" data-tauri-drag-region>
          <span id="topbar-title" class="topbar-title" data-tauri-drag-region>Projects</span>
          <span id="topbar-detail" class="topbar-detail" data-tauri-drag-region></span>
        </div>
        <div class="topbar-actions">
          <button id="update-button" class="btn btn-quiet btn-sm" type="button" hidden>
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 1.9v8.3M4.8 7l3.2 3.2L11.2 7" />
              <path d="M2.4 12.4v1.3h11.2v-1.3" />
            </svg>
            <span>Update</span>
          </button>
        </div>
      </header>

      <main
        id="view"
        class="view"
        role="tabpanel"
        aria-labelledby="nav-projects"
        tabindex="-1"
      ></main>

      <footer class="statusbar">
        <span id="status-left" class="status-left">Starting…</span>
        <span id="status-right" class="status-right">daemon: idle</span>
      </footer>
    </div>

    <!-- App-level overlays. The overwrite flow is a modal, not a route (Design 7.3). -->
    <div id="modal-root" class="modal-root"></div>
    <div id="dialog-root" class="dialog-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
