[package]
name = "wsync"
authors = ["Pugbread"]
description = "Filesystem to Roblox Studio sync tool for Roblox development"
repository = "https://github.com/Pugbread/wsync"
documentation = "https://github.com/Pugbread/wsync"
homepage = "https://github.com/Pugbread/wsync"
license = "Apache-2.0"
# WSync's real version. The stock Argon plugin still version-gates against
# msgpack `GET /details`, which reports `constants::ARGON_COMPAT_VERSION`
# when `compat_argon` is enabled (see `src/server/details.rs`)
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "wsync"
path = "src/main.rs"

[lib]
name = "wsync"
path = "src/lib.rs"

[features]
plugin = []

[dependencies]
rbx_xml = "2.0.1"
rbx_binary = "2.0.1"
rbx_dom_weak = "4.1.0"
rbx_reflection = "6.1.0"
rbx_reflection_database = "2.0.2"

config-derive = { version = "*", path = "crates/config-derive" }
json-formatter = { version = "*", path = "crates/json-formatter" }
profiling = { version = "*", path = "crates/profiling/profiling" }

uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
serde = { version = "1.0.228", features = ["derive"] }
rmpv = { version = "1.3.1", features = ["with-serde"] }
clap = { version = "4.5.60", features = ["derive", "cargo"] }
reqwest = { version = "0.12.28", default-features = false, features = [
	"blocking",
	"rustls-tls",
	"json",
	# The Open Cloud command family (`upload`, `monetization`) speaks
	# multipart/form-data
	"multipart",
] }
self_update = { version = "0.39.0", default-features = false, features = [
	"compression-zip-deflate",
	"rustls",
] }

notify-debouncer-full = "0.3.1"
clap-verbosity-flag = "2.2.3"
crossbeam-channel = "0.5.15"
derive-from-one = "0.1.0"
roblox_install = "1.0.0"
panic-message = "0.3.0"
puffin_http = "0.16.0"
serde_json = "1.0.149"
env_logger = "0.11.6"
include_dir = "0.7.4"
directories = "5.0.1"
lazy_static = "1.5.0"
backtrace = "0.3.76"
documented = "0.9.2"
dialoguer = "0.12.0"
path-clean = "1.0.1"
rmp-serde = "1.3.1"
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake"] }
sha2 = "0.10.9"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
mime = "0.3.17"
multimap = "0.10.1"
optfield = "0.4.0"
markdown = "0.3.0"

base64 = "0.22.1"
json2lua = "0.1.3"
toml2lua = "0.1.0"
yaml2lua = "0.1.1"
globenv = "0.2.1"

puffin = "0.19.0"
colored = "2.2.0"
png = "0.17.16"
anyhow = "1.0.102"
chrono = "0.4.44"
notify = "6.1.1"
whoami = "1.6.1"
trash = "5.2.5"
ctrlc = "3.5.2"
toml = "0.9.12"
glob = "0.3.3"
open = "5.3.3"
log = "0.4.29"
csv = "1.4.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
keybd_event = "0.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.26", features = ["user"] }

[build-dependencies]
anyhow = "1.0.102"

[dev-dependencies]
approx = "0.5.1"
tokio-tungstenite = "0.24.0"
tempfile = "3.14.0"

[patch.crates-io]
notify-debouncer-full = { path = "crates/notify-debouncer-full" }
self_update = { path = "crates/self_update" }
